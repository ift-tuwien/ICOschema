[package]
name = "icoschema"
version = "0.1.1"
edition = "2021"
description = "Rust port of ICOschema: generated schema types, a model API and an HDF5 reader"
publish = false

[dependencies]
icoschema-gen = { path = "../icoschema/schema/generated/rust", default-features = false }
rust-hdf5 = "0.7"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
serde_yml = "0.0.12"
