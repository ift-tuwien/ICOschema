[project]
name = "icoschema"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "h5py>=3.16.0",
  "linkml>=1.11.1",
  "numpy>=2.5.1",
  "pandas>=3.0.3",
]

[dependency-groups]
dev = ["pandas-stubs>=3.0.3.260530", "pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ICOschema"]
